name: Обновление списков

on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

jobs:
  Update_lists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Чекаем репо
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Устанавливаем GO
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Скачиваем и обрабатываем список доменов
        run: |
          mkdir -p data
          
          # Скачивание hagezi с зачисткой переносов строк \r
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt" | tr -d '\r' > pro-onlydomains.txt
          grep -v '^#' pro-onlydomains.txt | grep -v '^$' > temp_cleaned.txt
          
          # Фильтрация (exclude/include)
          if [ -f exclude.list ]; then
            grep -vFf exclude.list temp_cleaned.txt > data/hagezi-pro
          else
            mv temp_cleaned.txt data/hagezi-pro
          fi
          
          if [ -f include.list ]; then
            cat include.list >> data/hagezi-pro
          fi

          # Убираем дубликаты и пустые строки
          sort -u data/hagezi-pro | grep -v '^$' > temp_sorted.txt
          mv temp_sorted.txt data/hagezi-pro

          # Сборка JSON для Sing-Box через jq
          jq -n \
            --rawfile domains data/hagezi-pro \
            '{
              version: 2,
              rules: [
                {
                  domain_suffix: ($domains | split("\n") | map(select(length > 0)))
                }
              ]
            }' > dimmyenergizi.json

      - name: Компиляция dimmyenergizi.dat
        run: |
          go mod download
          go run main.go

      - name: Устанавливаем Sing-Box
        run: |
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box .
          chmod +x sing-box

      - name: Компиляция dimmyenergizi.srs
        run: |
          ./sing-box rule-set compile --output dimmyenergizi.srs dimmyenergizi.json

      - name: Компиляция dimmyenergizi.mrs (Mihomo)
        run: |
          MIHOMO_URL=$(curl -fsSL --retry 3 "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-v3-v.*\\.gz$")) | .browser_download_url')
          curl -fsSL --retry 3 "$MIHOMO_URL" -o mihomo.gz && gunzip mihomo.gz && chmod +x mihomo
          sed 's/^/+./' data/hagezi-pro > mihomo_domains.txt
          ./mihomo convert-ruleset domain text mihomo_domains.txt dimmyenergizi.mrs

      - name: Обновление dimmyenergizi.srs в корне репозитория
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dimmyenergizi.srs
          git commit -m "chore: auto-update dimmyenergizi.srs [skip ci]" || echo "Нет изменений для коммита"
          git push origin main

      - name: Публикация релиза и удаление старых
        run: |
          RELEASE_DATE=$(date +%d.%m.%Y)
          TAG_NAME="release-${RELEASE_DATE}"
          
          # Публикация/обновление релиза через GitHub CLI
          gh release create "$TAG_NAME" dimmyenergizi.dat dimmyenergizi.srs dimmyenergizi.mrs \
            --title "Списки от ${RELEASE_DATE}" \
            --notes "Автоматическое обновление списков." \
            --latest || \
          gh release upload "$TAG_NAME" dimmyenergizi.dat dimmyenergizi.srs dimmyenergizi.mrs --clobber

          # Удаление старых релизов (оставляем только последние 3)
          OLD_RELEASES=$(gh release list --limit 100 | awk '{print $3}' | tail -n +4)
          for tag in $OLD_RELEASES; do
            echo "Удаляем старый релиз: $tag"
            gh release delete "$tag" --cleanup-tag -y || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
